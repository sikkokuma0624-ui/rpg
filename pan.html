<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パン教祖爆誕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#5a3820; --paper:#f7edd5; --paper2:#efdfba; --ink:#3a2614; --sub:#8a6a48;
  --gold:#e2b24a; --gold-d:#a67a22; --wine:#7a1f2b; --wine-d:#4e1018;
  --k-noun:#9a5b22; --k-sim:#6d3fa0; --k-phr:#2f7a4c; --k-verb:#a8322a;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:#3e2513}
body{
  font-family:var(--maru);color:var(--ink);min-height:100vh;
  padding:14px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;overflow-x:hidden;
  /* 木のテーブル */
  background:
    radial-gradient(ellipse at 50% -5%,rgba(255,196,110,.28),transparent 55%),
    radial-gradient(ellipse at 50% 115%,rgba(0,0,0,.55),transparent 60%),
    repeating-linear-gradient(90deg,transparent 0 138px,rgba(0,0,0,.38) 138px 140px,rgba(255,220,170,.06) 140px 141px),
    repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px,rgba(255,230,190,.035) 7px 9px,transparent 9px 17px),
    repeating-linear-gradient(88deg,rgba(0,0,0,.05) 0 1px,transparent 1px 29px),
    linear-gradient(90deg,#5b3920,#6a442a 30%,#58361e 55%,#6b452b 80%,#5a3820);
  background-attachment:fixed;
}
.hidden{display:none!important}
button{font:inherit;border:none;cursor:pointer;color:inherit}
.center{text-align:center}
.on-wood{color:#f3dfb8;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* 紙 */
.paper{
  background:
    radial-gradient(circle at 15% 20%,rgba(190,140,60,.10),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(160,110,40,.12),transparent 45%),
    linear-gradient(135deg,#fbf3df,#f1e2bf);
  border-radius:6px;
  box-shadow:0 1px 0 #d9c497,0 2px 0 #cdb685,0 10px 18px rgba(0,0,0,.45),inset 0 0 30px rgba(150,100,30,.15);
}

/* ===== ボタン：封蝋のような立体ボタン ===== */
.btn{
  display:block;width:100%;padding:15px;margin-top:14px;border-radius:14px;
  font-family:var(--mincho);font-size:19px;font-weight:800;letter-spacing:.12em;color:#ffe7a8;
  background:linear-gradient(180deg,#a3313f,var(--wine) 55%,#651824);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25),0 5px 0 var(--wine-d),0 10px 16px rgba(0,0,0,.45);
  text-shadow:0 1px 0 #3a0a10,0 0 10px rgba(255,200,90,.45);
  border:1px solid #c58b3d;transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 1px 0 var(--wine-d),0 3px 6px rgba(0,0,0,.4)}
.btn:disabled{filter:grayscale(.6) brightness(.8);opacity:.7}
.btn.wood{
  color:#4a2c14;text-shadow:0 1px 0 rgba(255,240,210,.6);font-size:16px;
  background:linear-gradient(180deg,#e2b98a,#c9955f);border-color:#8f5f33;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 #7a4c25,0 10px 16px rgba(0,0,0,.4);
}

/* ===== タイトル ===== */
.emblem{width:190px;height:190px;margin:26px auto 4px;position:relative;display:flex;align-items:center;justify-content:center}
.emblem::before{content:"";position:absolute;inset:-30px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,214,120,.5) 0 6deg,transparent 6deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 30s linear infinite}
.emblem .ring{position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7d2533,#4e1018 70%);
  box-shadow:0 0 0 5px #d9a845,0 0 0 8px #6b4515,0 0 0 10px #e8c066,0 12px 24px rgba(0,0,0,.6),inset 0 6px 14px rgba(0,0,0,.5)}
.emblem .ring::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px dashed rgba(240,200,110,.7)}
.emblem .bread{position:relative;font-size:76px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5)) drop-shadow(0 0 14px rgba(255,200,80,.6));animation:float 3s ease-in-out infinite}
.title{font-family:var(--mincho);font-weight:800;font-size:40px;text-align:center;margin:8px 0 0;letter-spacing:.08em;
  background:linear-gradient(180deg,#fff4c8 0%,#f0c35a 45%,#b47a1e 55%,#f6d47c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #4a2a0c) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.tagline{font-family:var(--mincho);text-align:center;color:#f3dfb8;font-size:15px;letter-spacing:.2em;margin:6px 0 18px;text-shadow:0 1px 2px #000}
.rules{padding:14px 16px;margin-top:22px;font-size:14px;transform:rotate(-.6deg)}
.rules summary{font-family:var(--mincho);font-weight:800;font-size:16px;cursor:pointer}
.rules ol{padding-left:1.3em;line-height:1.8;color:#5a4128;margin:8px 0 0}

/* ===== お悩み：ピン留めされた手紙 ===== */
.topic{position:relative;padding:16px 16px 14px;margin:10px 4px 18px;transform:rotate(-1.2deg)}
.topic::before{content:"";position:absolute;top:-9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff7b6b,#b3221a 60%,#6d0f0a);box-shadow:0 3px 4px rgba(0,0,0,.5)}
.topic small{display:block;font-size:11px;color:var(--sub);letter-spacing:.15em}
.topic span{font-family:var(--mincho);font-weight:800;font-size:19px;line-height:1.5}

/* ===== 神託の祭壇（ベルベットのマット） ===== */
.altar{position:relative;border-radius:16px;padding:14px 12px 12px;
  background:radial-gradient(ellipse at 50% 30%,#8e2a37,#5a1520 75%);
  box-shadow:0 0 0 3px #c99a43,0 0 0 6px #5a3a14,0 0 0 7px #e5bd63,0 12px 22px rgba(0,0,0,.55),inset 0 4px 16px rgba(0,0,0,.6)}
.altar::before{content:"";position:absolute;inset:6px;border-radius:11px;border:1.5px dashed rgba(240,200,110,.55);pointer-events:none}
.altar-title{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-family:var(--mincho);font-weight:800;font-size:12px;letter-spacing:.3em;
  color:#4a2a0c;background:linear-gradient(#fbe3a0,#d9a845);padding:3px 14px;border-radius:20px;box-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap}
.board{min-height:92px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;align-items:center;position:relative;padding:6px 2px}
.board.empty::before{content:"手札とつなぎ言葉をタップして神託を組み立てよ";color:rgba(255,220,170,.55);font-size:13px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mincho)}
.preview{font-family:var(--mincho);font-weight:800;font-size:17px;line-height:1.6;color:#ffe7b0;text-shadow:0 1px 2px #000;margin-top:8px;padding:8px 6px 2px;border-top:1px solid rgba(240,200,110,.3);min-height:1.6em;text-align:center}

/* 祭壇に置かれた言葉：小さなカード */
.chip{position:relative;padding:7px 10px 6px;border-radius:6px;font-size:15px;font-weight:700;line-height:1.25;
  background:linear-gradient(135deg,#fffaf0,#f1e3c2);color:var(--ink);border-top:3px solid var(--c,var(--k-noun));
  box-shadow:0 1px 0 #d6c398,0 2px 0 #bfa877,0 5px 8px rgba(0,0,0,.45);transition:transform .12s}
.chip.sel{transform:translateY(-5px) rotate(-2deg);box-shadow:0 0 0 2px #ffd65a,0 1px 0 #d6c398,0 2px 0 #bfa877,0 10px 14px rgba(0,0,0,.5)}
/* 真鍮のトークン（つなぎ言葉） */
.token{position:relative;padding:7px 12px;border-radius:999px;font-size:15px;font-weight:700;color:#4a300c;
  background:radial-gradient(ellipse at 50% 20%,#fff0b8,#e7bd5c 50%,#b8862b);
  border:1px solid #8a6420;text-shadow:0 1px 0 rgba(255,250,220,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 3px rgba(120,80,10,.4),0 3px 0 #7a5618,0 5px 7px rgba(0,0,0,.45);transition:transform .08s}
.token:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 #7a5618,0 2px 3px rgba(0,0,0,.4)}
.token.holy{color:#ffe7a8;text-shadow:0 1px 0 #3a0a10;background:radial-gradient(ellipse at 50% 20%,#d65463,#9a2232 55%,#5e1019);border-color:#3e0a12;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.4),0 3px 0 #3e0a12,0 5px 7px rgba(0,0,0,.45),0 0 10px rgba(255,90,90,.35)}
.token.sel{transform:translateY(-5px);box-shadow:0 0 0 2px #fff3b0,0 8px 12px rgba(0,0,0,.5)}

.tools{display:flex;gap:7px;margin-top:14px}
.tools button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;color:#4a2c14;
  background:linear-gradient(180deg,#e9c597,#c99a63);border:1px solid #8f5f33;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #7a4c25,0 5px 8px rgba(0,0,0,.35)}
.tools button:active{transform:translateY(3px);box-shadow:0 0 0 #7a4c25}
.tools button:disabled{filter:grayscale(.5);opacity:.45}

.label{font-family:var(--mincho);font-weight:800;font-size:13px;letter-spacing:.15em;margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.label::before{content:"✦ "}
.label span{flex:1}
.link{background:none;font-family:var(--maru);font-size:12px;letter-spacing:0;color:#f3c96a;text-decoration:underline;text-shadow:0 1px 2px #000}
.link:disabled{opacity:.45;text-decoration:none}

/* ===== 手札：厚みのあるカード ===== */
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;position:relative;z-index:60;perspective:800px}
.card{
  position:relative;min-height:96px;padding:24px 8px 12px;border-radius:10px;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.8),transparent 45%),
    linear-gradient(160deg,#fffaf0,#f2e3c3);
  font-weight:700;font-size:15px;line-height:1.3;color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all;
  transform:rotate(var(--r,0deg));transition:transform .15s,box-shadow .15s,filter .2s;
  box-shadow:0 1px 0 #e3d3ae,0 2px 0 #d4c08f,0 3px 0 #c5ae7c,0 4px 0 #b39a68,0 10px 16px rgba(0,0,0,.5);
}
.card::before{content:"";position:absolute;inset:5px;border:1.5px solid var(--c);border-radius:6px;opacity:.75;pointer-events:none}
.card::after{content:"✦";position:absolute;bottom:6px;right:8px;font-size:9px;color:var(--c);opacity:.8}
.card .kind{position:absolute;top:-7px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;font-weight:700;letter-spacing:.1em;color:#fff;padding:3px 10px;border-radius:4px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 2px 3px rgba(0,0,0,.4)}
.card .kind::before{content:attr(data-i) " "}
.card .txt{position:relative}
.card:active:not(:disabled){transform:rotate(var(--r,0deg)) translateY(3px)}
.card.used{transform:rotate(var(--r,0deg)) translateY(4px) scale(.96);filter:grayscale(.7) brightness(.75);
  box-shadow:0 1px 0 #c5ae7c,0 3px 5px rgba(0,0,0,.4)}
.card .stamp{display:none;position:absolute;right:-6px;bottom:-6px;transform:rotate(-14deg);
  font-family:var(--mincho);font-weight:800;font-size:12px;letter-spacing:.1em;color:#fff;background:#b3221a;border:2px solid #fff3e0;border-radius:5px;padding:1px 5px;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.card.used .stamp{display:block}
.card.wait{visibility:hidden}
.card.landed{animation:land .7s ease-out}
@keyframes land{0%{box-shadow:0 0 0 0 var(--c),0 0 46px 14px #ffd65a}100%{}}
.k-noun{--c:var(--k-noun)} .k-sim{--c:var(--k-sim)} .k-phr{--c:var(--k-phr)} .k-verb{--c:var(--k-verb)}
.conns{display:flex;flex-wrap:wrap;gap:9px 7px}

/* ===== 配る演出 ===== */
#dealOverlay{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,rgba(255,210,110,.3),rgba(20,8,2,.72));display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .3s}
#dealOverlay.on{opacity:1}
#dealOverlay .msg{margin-top:11vh;font-family:var(--mincho);font-weight:800;color:#fff3c8;font-size:24px;letter-spacing:.25em;text-shadow:0 0 12px #ffb300,0 0 28px #ff8a00;animation:pulse 1s ease-in-out infinite}
#dealOverlay .rays{position:absolute;left:50%;top:30%;width:560px;height:560px;margin:-280px 0 0 -280px;background:repeating-conic-gradient(rgba(255,226,150,.38) 0 7deg,transparent 7deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 18%,transparent 70%);mask:radial-gradient(circle,#000 18%,transparent 70%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.6;transform:scale(1.05)}}
@keyframes float{50%{transform:translateY(-6px)}}
.flyer{position:fixed;z-index:70;border-radius:10px;pointer-events:none;will-change:transform}
.back{
  background:
    radial-gradient(circle at 50% 50%,transparent 26%,rgba(0,0,0,.25) 27%,transparent 29%),
    repeating-conic-gradient(from 0deg at 50% 50%,rgba(240,195,100,.22) 0 10deg,transparent 10deg 20deg),
    radial-gradient(circle at 50% 40%,#9c2c3b,#5a1220 75%);
  border:3px solid #e2b24a;display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 0 0 2px #5a3a14,0 0 28px rgba(255,200,60,.9),0 12px 20px rgba(0,0,0,.6)}
.back::after{content:"";position:absolute;inset:5px;border:1px solid rgba(240,200,110,.8);border-radius:6px}
.spark{position:fixed;z-index:80;pointer-events:none;line-height:1}
.flash{position:fixed;inset:0;z-index:75;background:#fff3c8;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}

/* ===== 発表：巻物 ===== */
.reveal-head{font-family:var(--mincho);font-weight:800;text-align:center;color:#f6d47c;font-size:22px;letter-spacing:.3em;margin:22px 0 4px;text-shadow:0 2px 0 #3a1f08,0 0 16px rgba(255,190,60,.6)}
.scroll{position:relative;margin:26px 6px 10px;padding:34px 22px 44px;text-align:center}
.scroll::before,.scroll::after{content:"";position:absolute;left:-10px;right:-10px;height:18px;border-radius:9px;
  background:linear-gradient(180deg,#a8743e,#e2b47a 40%,#7a4c22);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.scroll::before{top:-9px}.scroll::after{bottom:-9px}
.scroll .q{font-size:12px;color:var(--sub);letter-spacing:.1em}
.scroll .oracle{font-family:var(--mincho);font-weight:800;font-size:25px;line-height:1.75;margin:12px 0 4px;color:#2e1a0a}
.scroll .who{font-family:var(--mincho);font-size:13px;color:var(--sub);letter-spacing:.2em}
.seal{position:absolute;right:16px;bottom:10px;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d6483f,#9a1e18 60%,#5c0e0a);color:#ffd9c0;
  display:flex;align-items:center;justify-content:center;font-family:var(--mincho);font-weight:800;font-size:22px;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -3px 5px rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.5);transform:rotate(-12deg)}
.seal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(255,210,190,.6)}
.pop{animation:pop .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.seal.stampin{animation:stamp .5s .6s both cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:scale(2.4) rotate(10deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
</style>
</head>
<body>

<!-- タイトル -->
<section id="sTitle">
  <div class="emblem"><div class="ring"></div><div class="bread">🍞</div></div>
  <h1 class="title">パン教祖爆誕</h1>
  <p class="tagline">迷える者に、パンの神託を</p>
  <button class="btn" id="startBtn">神託を授かる</button>
  <details class="paper rules">
    <summary>教典（あそびかた）</summary>
    <ol>
      <li>信者のお悩みが届きます。</li>
      <li>カードが6枚配られます。タップして並べ、神託を作ります。カードは全部使わなくてOK。</li>
      <li>「神・あなた・は・そして」などの<b>つなぎ言葉</b>は手札とは別に何度でも使えます。</li>
      <li>祭壇の言葉をタップすると選択でき、◀▶で並べ替え、✕で手札に戻せます。選択中に足した言葉はその後ろに入ります。</li>
      <li>手札の引き直しは1回だけできます。</li>
    </ol>
  </details>
</section>

<!-- 作成 -->
<section id="sCompose" class="hidden">
  <div class="topic paper"><small>迷える信者のお悩み</small><span id="cTopic"></span></div>
  <div class="altar">
    <div class="altar-title">神託の祭壇</div>
    <div class="board" id="board"></div>
    <div class="preview" id="preview"></div>
  </div>
  <div class="tools">
    <button id="tLeft">◀</button><button id="tRight">▶</button><button id="tDel">✕ 戻す</button><button id="tClear">全消し</button>
  </div>
  <div class="label on-wood"><span>手札</span><button class="link" id="redeal">引き直す（残り1回）</button></div>
  <div class="hand" id="hand"></div>
  <div class="label on-wood"><span>つなぎ言葉（何度でも）</span></div>
  <div class="conns" id="conns"></div>
  <button class="btn" id="submitBtn" disabled>この神託を授ける</button>
</section>

<!-- 発表 -->
<section id="sReveal" class="hidden">
  <div class="reveal-head">神 託</div>
  <div class="scroll paper pop" id="scroll">
    <div class="q" id="rTopic"></div>
    <div class="oracle" id="oracle"></div>
    <div class="who">— パン教祖</div>
    <div class="seal stampin" id="seal">麦</div>
  </div>
  <button class="btn" id="againBtn">次の信者を救う</button>
  <button class="btn wood" id="titleBtn">タイトルへ</button>
</section>

<div id="dealOverlay" class="hidden"><div class="rays"></div><div class="msg">神託のカード降臨</div></div>

<script>
// ===== データ =====
const K = {noun:"名詞", sim:"たとえ", phr:"フレーズ", verb:"おこない"};
const KICON = {noun:"🍞", sim:"🌀", phr:"📜", verb:"🔥"};
const DECK = {
  noun:[
    "食パン","クロワッサン","バゲット","メロンパン","あんぱん","カレーパン","クリームパン","ベーグル","コッペパン","焼きそばパン","塩パン","ブリオッシュ","パンの耳","天然酵母","強力粉","バター","イースト菌","石窯","パン粉","いちごジャム","トースター","焦げ目","生地","ちくわパン","レーズン","バターロール","揚げパン","聖なる小麦",
    "人生","愛","明日","過去","罪","涙","魂","運命","上司","元恋人","月曜日","宇宙","真実","心","世界","夢","隣人","財布","給料日","母","推し","体重計","目覚まし時計",
    "冷蔵庫","消費税","ペンギン","満員電車","確定申告","靴下の片方","富士山","段ボール","洗濯機","エレベーター","電子レンジ","町内会","3丁目の田中さん","未読メール","有給休暇","筋肉","回覧板","住民票","カニ","Wi-Fi","昨日の晩ごはん",
    "教義","聖典","生贄","洗礼","啓示","預言者","楽園","終末","信仰","煉獄","第三の目","原罪","輪廻","審判の日","救世主","異端者","供物","祭壇","聖痕","奇跡","教団","来世","前世","悪魔","天使の羽"
  ],
  sim:["焼きたてのように","まるでバターが溶けるように","発酵した生地のように","パンの耳のように静かに","トースターから飛び出すように","二次発酵を待つように","小麦畑を渡る風のように","クロワッサンの層のように","朝のパン屋の香りのように","食パンをくわえて走る少女のように","カチカチのフランスパンのように","袋の底のパンくずのように","閉店間際のパン屋のように",
    "狂い咲く麦の穂のように","祭壇に捧げられた食パンのように","天から降り注ぐパンくずのように","終末のラッパが鳴り響くように","永遠に焼かれ続けるように","脳髄がとろけるように","三日三晩祈り続けるように","生贄の子羊のように","満員電車に押し込まれるように","確定申告の締切前夜のように","ペンギンが空を夢見るように","冷蔵庫の奥で眠るように"],
  phr:["に満たされた人生","外はカリッと中はふんわり","焼きたての","一斤の","罪深いほどの","毎朝の","耳まで愛される","冷めても美味しい","半額シールの貼られた","永遠に膨らむ","選ばれし","小麦色の","ひとかけらの","二度焼きされた","粉まみれの","バター多めの","賞味期限が近い","モチモチの",
    "魂ごと","全身全霊で","骨の髄まで","永遠に","千の目を持つ","血より濃い","生まれる前から決まっていた","選ばれなかった者の","声なき声で","一片の疑いもなく","救済の","聖なる","呪われた","光り輝く","逃れられない","すべてを焼き尽くす","目を閉じても見える","頭の中に直接響く"],
  verb:["こねよ","焼き上がる","膨らむ","発酵を待て","ちぎれ","分け与えよ","トーストせよ","焦げてもよい","寝かせなさい","祈りなさい","赦される","救われる","満たされる","恐れるな","ふんわりと生きよ","はさめ","噛みしめよ","溶ける","包み込め",
    "跪け","崇めよ","目覚めよ","捧げよ","悔い改めよ","信じよ","委ねよ","受け入れよ","唱えよ","還れ","生まれ変わる","ひとつになる","導かれる","浄化される","疑うな","叫べ","忘れよ","帰依せよ","焼かれよ","もう戻れない"]
};
const HOLY = ["神","あなた"];
const CONNS = [...HOLY,"は","が","を","に","の","と","も","で","へ","こそ","より","そして","しかし","だから","ならば","ように","、","。","！","……","よ","なのです","である","ではない","せよ","しか"];
const TOPICS = ["仕事を辞めたいです","恋人ができません","朝どうしても起きられません","人生の意味がわかりません","ダイエットが続きません","上司が怖いです","お金がありません","推しが結婚しました","将来が不安です","友達とケンカしました","自分に自信がありません","夜眠れません","何をやっても長続きしません","試験に落ちました","隣の芝生が青く見えます","月曜日が来るのが怖いです","SNSを見て落ち込みます","部屋が片付けられません","親とうまく話せません","やる気が出ません"];
const KCOLOR = {noun:"#ffb35a",sim:"#c98bff",phr:"#6fe39a",verb:"#ff6f5e"};

// ===== ユーティリティ =====
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show = id => { document.querySelectorAll("body>section").forEach(s=>s.classList.add("hidden")); $(id).classList.remove("hidden"); window.scrollTo(0,0); };
const joinText = toks => toks.map(t=>t.text).join("");
const wait = ms => new Promise(r=>setTimeout(r,ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ===== 状態 =====
let G = null, deckPile = [], topicPile = [];
function refill(){ const out=[]; for(const k in DECK) DECK[k].forEach(t=>out.push({text:t,kind:k})); deckPile = shuffle(out); }
function draw(n){
  if(deckPile.length<n+10) refill();
  const pick=[];
  for(const k of ["sim","phr","verb"]){ const i=deckPile.findIndex(c=>c.kind===k); pick.push(deckPile.splice(i,1)[0]); }
  while(pick.length<n) pick.push(deckPile.pop());
  return shuffle(pick).map((c,i)=>({...c,id:"c"+i+"_"+Math.random(),used:false,tilt:(Math.random()*4-2).toFixed(1)}));
}
function nextTopic(){ if(!topicPile.length) topicPile = shuffle(TOPICS); return topicPile.pop(); }

// ===== 開始 =====
function startGame(){
  G = { topic:nextTopic(), hand:draw(6), sentence:[], sel:-1, redeals:1, dealing:true };
  $("cTopic").textContent = "「"+G.topic+"」";
  renderConns(); renderCompose(); show("sCompose");
  dealAnimation();
}
$("startBtn").onclick = startGame;
$("againBtn").onclick = startGame;
$("titleBtn").onclick = ()=>show("sTitle");

// ===== 配る演出 =====
async function dealAnimation(){
  G.dealing = true; renderCompose();
  const ov=$("dealOverlay"); ov.classList.remove("hidden"); await wait(20); ov.classList.add("on");
  $("hand").scrollIntoView({block:"center",behavior:reduced?"auto":"smooth"});
  await wait(reduced?50:550);
  const cards=[...$("hand").querySelectorAll(".card")];
  for(let i=0;i<cards.length;i++) await dealOne(cards[i], G.hand[i], i===cards.length-1);
  await wait(250);
  ov.classList.remove("on"); await wait(300); ov.classList.add("hidden");
  G.dealing=false; renderCompose();
}
async function dealOne(el, c, last){
  const r = el.getBoundingClientRect();
  const fly = document.createElement("div");
  fly.className="flyer back"; fly.textContent="🍞";
  Object.assign(fly.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  document.body.appendChild(fly);
  const sx = innerWidth/2 - (r.left+r.width/2), sy = innerHeight*0.3 - (r.top+r.height/2);
  const spin = (Math.random()<.5?-1:1)*(360+Math.random()*180) + (+c.tilt);
  if(!reduced){
    await fly.animate([
      {transform:`translate(${sx}px,${sy-120}px) scale(.2)`,opacity:0},
      {transform:`translate(${sx}px,${sy}px) scale(1.7)`,opacity:1,offset:.35},
      {transform:`translate(${sx}px,${sy}px) scale(1.8)`,offset:.5},
      {transform:`translate(0,0) scale(1) rotate(${spin}deg)`}
    ],{duration:620,easing:"cubic-bezier(.3,.7,.3,1)"}).finished;
    await fly.animate([{transform:`rotate(${c.tilt}deg) scaleX(1)`},{transform:`rotate(${c.tilt}deg) scaleX(0)`}],{duration:110,easing:"ease-in"}).finished;
  }
  fly.remove();
  el.classList.remove("wait"); el.classList.add("landed");
  if(!reduced){
    el.animate([{transform:`rotate(${c.tilt}deg) scaleX(0)`},{transform:`rotate(${c.tilt}deg) scale(1.15)`},{transform:`rotate(${c.tilt}deg) scale(1)`}],{duration:260,easing:"ease-out"});
    burst(r, KCOLOR[c.kind], last);
    if(navigator.vibrate) try{navigator.vibrate(last?[30,40,60]:20);}catch(e){}
  }
  await wait(reduced?60:(last?320:140));
}
function burst(r, color, big){
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const syms=["✦","✧","★","🍞","✨","☩"];
  const n = big?22:12;
  for(let i=0;i<n;i++){
    const s=document.createElement("span"); s.className="spark";
    s.textContent=syms[Math.random()*syms.length|0];
    s.style.left=cx+"px"; s.style.top=cy+"px"; s.style.color=color; s.style.textShadow=`0 0 8px ${color}`;
    s.style.fontSize=(12+Math.random()*(big?18:10))+"px";
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=50+Math.random()*(big?140:80);
    s.animate([
      {transform:"translate(-50%,-50%) scale(.3)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(1) rotate(${Math.random()*360}deg)`,opacity:0}
    ],{duration:600+Math.random()*400,easing:"cubic-bezier(.1,.8,.3,1)"}).finished.then(()=>s.remove());
  }
  if(big){
    const f=document.createElement("div"); f.className="flash"; document.body.appendChild(f);
    f.animate([{opacity:.85},{opacity:0}],{duration:450}).finished.then(()=>f.remove());
    document.body.classList.add("shake"); setTimeout(()=>document.body.classList.remove("shake"),400);
  }
}

// ===== 作成画面 =====
function renderConns(){
  const box=$("conns"); box.innerHTML="";
  CONNS.forEach(t=>{ const b=document.createElement("button"); b.className="token"+(HOLY.includes(t)?" holy":""); b.textContent=t;
    b.onclick=()=>{ if(!G.dealing) addToken({text:t,kind:"conn"}); }; box.appendChild(b); });
}
function addToken(tok){
  if(G.sel>=0){ G.sentence.splice(G.sel+1,0,tok); G.sel++; } else G.sentence.push(tok);
  renderCompose();
}
function renderCompose(){
  const hand=$("hand"); hand.innerHTML="";
  G.hand.forEach(c=>{
    const b=document.createElement("button"); b.className=`card k-${c.kind}`+(c.used?" used":"")+(G.dealing?" wait":"");
    b.style.setProperty("--r",c.tilt+"deg");
    b.innerHTML=`<span class="kind" data-i="${KICON[c.kind]}">${K[c.kind]}</span><span class="txt">${esc(c.text)}</span><span class="stamp">奉納</span>`;
    b.disabled=c.used||G.dealing;
    b.onclick=()=>{ c.used=true; addToken({text:c.text,kind:c.kind,cid:c.id}); };
    hand.appendChild(b);
  });
  const board=$("board"); board.innerHTML="";
  board.classList.toggle("empty", !G.sentence.length);
  G.sentence.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className=(t.kind==="conn"?"token"+(HOLY.includes(t.text)?" holy":""):"chip k-"+t.kind)+(i===G.sel?" sel":"");
    b.textContent=t.text;
    b.onclick=()=>{ G.sel = (G.sel===i?-1:i); renderCompose(); };
    board.appendChild(b);
  });
  $("preview").textContent = G.sentence.length ? "「"+joinText(G.sentence)+"」" : "";
  $("preview").classList.toggle("hidden", !G.sentence.length);
  const s=G.sel>=0;
  $("tLeft").disabled=!s||G.sel===0; $("tRight").disabled=!s||G.sel===G.sentence.length-1;
  $("tDel").disabled=!s; $("tClear").disabled=!G.sentence.length;
  $("submitBtn").disabled = G.dealing || !G.sentence.some(t=>t.kind!=="conn");
  const r=$("redeal"); r.textContent = G.redeals?"引き直す（残り1回）":"引き直し済み"; r.disabled=!G.redeals||G.dealing;
}
function move(d){ const i=G.sel,j=i+d; [G.sentence[i],G.sentence[j]]=[G.sentence[j],G.sentence[i]]; G.sel=j; renderCompose(); }
$("tLeft").onclick=()=>move(-1);
$("tRight").onclick=()=>move(1);
$("tDel").onclick=()=>{
  const t=G.sentence.splice(G.sel,1)[0];
  if(t.cid){ const c=G.hand.find(c=>c.id===t.cid); if(c) c.used=false; }
  G.sel = Math.min(G.sel, G.sentence.length-1);
  renderCompose();
};
$("tClear").onclick=()=>{ G.sentence=[]; G.sel=-1; G.hand.forEach(c=>c.used=false); renderCompose(); };
$("redeal").onclick=()=>{
  if(!G.redeals||G.dealing) return;
  if(G.sentence.length && !confirm("並べた神託は消えます。引き直しますか？")) return;
  G.redeals=0; G.hand=draw(6); G.sentence=[]; G.sel=-1;
  dealAnimation();
};

// ===== 発表 =====
$("submitBtn").onclick=()=>{
  $("rTopic").textContent="お悩み「"+G.topic+"」への答え";
  $("oracle").textContent="「"+joinText(G.sentence)+"」";
  show("sReveal");
  for(const id of ["scroll","seal"]){ const o=$(id); const c=id==="scroll"?"pop":"stampin"; o.classList.remove(c); void o.offsetWidth; o.classList.add(c); }
  if(!reduced) setTimeout(()=>burst($("scroll").getBoundingClientRect(),"#ffcc33",true),300);
};
</script>
