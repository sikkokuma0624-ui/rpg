const SKILL_INDEX={};Object.values(SKILLS).forEach(a=>a.forEach(s=>SKILL_INDEX[s.id]=s));

function flagDesc(fl,v){const m={critRate:`会心率+${v}`,critDmg:`会心威力+${v}`,eva:`回避+${v}`,hit:`命中+${v}`,defPen:`防御無視+${v}%`,healPow:`回復量+${v}%`,extraAct:`追加行動率+${v}%`,double:`通常攻撃が2回`,mpReduce:`MP消費-20%`,summonMax:`召喚数+1`,summonPow:`召喚威力+${v}%`,dmgReduce:`被ダメ-${v}%`,healRecv:`被回復+${v}%`,buffPow:`強化効果+${v}%`,elemPow:`属性威力+${v}%`,enemyHit:`敵命中${v}`,corpse:`撃破時死体カウント`,firstStrike:`先制ダメージ+${v}%`,hpCostPow:`血代償威力+${v}%`};return m[fl]||"";}
function skillDesc(s){const p=[];p.push(s.ty==="P"?"【被动】常に発動。":"【主动】"+`MP${s.mp||0}消費。`);
switch(s.k){case"stat":p.push(`${s.stat==="all"?"全ステータス":STAT_NM[s.stat]}+${s.pct}%${s.cond?"(HP低下時発動)":""}。`);break;
case"flag":p.push(flagDesc(s.fl,s.val)+"。");break;
case"dmg":p.push(`${s.mg?"魔法":"物理"}攻撃 威力${s.pw}${s.hits>1?`×${s.hits}回`:""}${s.tg==="all"?"(全体)":""}${s.el?` 属性[${EL_NM[s.el]}]`:""}${s.st?` ${ST_NM[s.st]}付与`:""}${s.brk?` ブレイク+${s.brk}`:""}${s.pen?` 防御無視${s.pen}%`:""}。`);break;
case"drain":p.push(`魔法威力${s.pw}+与ダメの半分を吸収。`);break;
case"heal":p.push(`HP回復 威力${s.pw}${s.tg==="party"?"(全体)":""}${s.st?" +再生付与":""}。`);break;
case"revive":p.push(`戦闘不能をHP${s.pw}%で蘇生。`);break;
case"buff":p.push(`${STAT_NM[s.stat]}+${s.pct}%(${s.tn}T)${s.tg==="party"?" 全体":""}。`);break;
case"debuff":p.push(`敵の${STAT_NM[s.stat]}-${s.pct}%(${s.tn||3}T)。`);break;
case"status":p.push(`敵に${ST_NM[s.st]||"状態異常"}を付与。`);break;
case"guard":p.push("ガードし被ダメ軽減・ヘイト上昇。");break;
case"shield":p.push(`味方に${s.pct}%ダメ軽減シールド(${s.tn}T)${s.tg==="party"?"全体":""}。`);break;
case"summon":p.push(`召喚獣を呼ぶ(追撃威力${s.pw})。`);break;
case"chant":p.push(`次の魔法威力+${s.pct}%。`);break;
case"cleanse":p.push("状態異常を解除。");break;
case"mp":p.push(`MPを${s.pw}回復。`);break;}

function jobStats(j,lv){const b=JOBS[j].base,g=JOBS[j].g,o={};STAT_KEYS.forEach(k=>o[k]=Math.floor(b[k]+g[k]*(lv-1)));return o;}
function titleBonus(){const b={atk:0,def:0,hp:0};const k=game.kills||0,bk=game.bossKills||0,tw=game.tower||1;
if(k>=50)b.atk+=3;if(k>=200)b.atk+=5;if(bk>=5)b.hp+=5;if(bk>=20)b.hp+=8;if(tw>=10)b.def+=3;if(tw>=30)b.def+=5;return b;}
function passiveMods(c){const m={pct:{},flat:{},flags:{}};(c.skills||[]).forEach(id=>{const s=SKILL_INDEX[id];if(!s||s.ty!=="P")return;
if(s.k==="stat"&&!s.cond){if(s.stat==="all")m.flags.allStatPct=(m.flags.allStatPct||0)+s.pct;else m.pct[s.stat]=(m.pct[s.stat]||0)+s.pct;}
if(s.k==="flag"){if(s.fl==="hit"||s.fl==="eva")m.flat[s.fl]=(m.flat[s.fl]||0)+s.val;else m.flags[s.fl]=(m.flags[s.fl]||0)+s.val;}});return m;}
function condMods(c,r){const m={};(c.skills||[]).forEach(id=>{const s=SKILL_INDEX[id];if(!s||s.ty!=="P"||s.k!=="stat"||!s.cond)return;
if(s.cond==="hp30"&&r<.3)m[s.stat]=(m[s.stat]||0)+s.pct;if(s.cond==="hp50"&&r<.5)m[s.stat]=(m[s.stat]||0)+s.pct;if(s.cond==="hp20"&&r<.2)m[s.stat]=(m[s.stat]||0)+s.pct;});return m;}
function setInfo(c){const cnt={},rc={};let maxSer=0;(c.equip||[]).forEach(uid=>{const it=(game.inv||[]).find(x=>x.uid===uid);if(!it)return;
if(it.series)cnt[it.series]=(cnt[it.series]||0)+1;rc[it.rar]=(rc[it.rar]||0)+1;maxSer=Math.max(maxSer,it.lv);});
return{sc:Math.max(0,...Object.values(cnt),0),maxSer,sameRar:Math.max(0,...Object.values(rc),0)};}
function equipSum(c){const t={};STAT_KEYS.forEach(k=>t[k]=0);(c.equip||[]).forEach(uid=>{const it=(game.inv||[]).find(x=>x.uid===uid);if(it){const enh=1+(it.enh||0)*.04;Object.entries(it.stats).forEach(([k,v])=>t[k]+=Math.round(v*enh));}});return t;}
function primaryMods(c){const a=Object.assign({str:0,dex:0,agi:0,vit:0,luk:0,int:0},c.primary||{}),s={hp:a.vit*6,mp:a.int*2,atk:a.str,def:a.str*.4+a.vit*.7,matk:a.int,mdef:0,agi:a.str*.25+a.agi,luk:a.luk,hit:a.dex*.7+a.luk*.2,eva:a.agi*.5+a.luk*.2};return{stats:s,crit:a.dex*.25+a.luk*.15,drop:a.luk*.4};}
function calcTotal(c){const base=jobStats(c.jobId,c.level),eq=equipSum(c),pm=passiveMods(c),pr=primaryMods(c),tb=titleBonus(),si=setInfo(c);const o={};
STAT_KEYS.forEach(k=>{let v=base[k]+eq[k]+(pr.stats[k]||0);v=Math.floor(v*(1+(pm.pct[k]||0)/100));if(pm.flat[k])v+=pm.flat[k];o[k]=Math.max(0,Math.floor(v));});
pm.flags.critRate=(pm.flags.critRate||0)+pr.crit;pm.flags.dropRate=(pm.flags.dropRate||0)+pr.drop;
if(pm.flags.allStatPct)STAT_KEYS.forEach(k=>o[k]=Math.ceil(o[k]*(1+pm.flags.allStatPct/100)));
o.atk=Math.floor(o.atk*(1+tb.atk/100));o.def=Math.floor(o.def*(1+tb.def/100));o.hp=Math.floor(o.hp*(1+tb.hp/100));
if(c.awakened)STAT_KEYS.forEach(k=>o[k]=Math.floor(o[k]*1.05));
if(c.reinc)STAT_KEYS.forEach(k=>o[k]=Math.floor(o[k]*(1+0.10*c.reinc)));
const hi=si.maxSer>=50;
if(si.sc>=2)o.def=Math.floor(o.def*(1+(hi?8:5)/100));
if(si.sc>=3){o.atk=Math.floor(o.atk*(1+(hi?8:5)/100));o.matk=Math.floor(o.matk*(1+(hi?8:5)/100));}
if(si.sc>=4){o.hp=Math.floor(o.hp*(1+(hi?10:8)/100));pm.flags.critRate=(pm.flags.critRate||0)+5;}
if(si.sameRar>=4)pm.flags.critDmg=(pm.flags.critDmg||0)+10;
o._flags=pm.flags;return o;}
function nextExp(lv){return Math.floor(20*Math.pow(lv,1.6)+50);}
function gainExp(c,amt){c.exp=(c.exp||0)+amt;while(c.level<100&&c.exp>=nextExp(c.level)){c.exp-=nextExp(c.level);c.level++;c.sp=(c.sp||0)+1;c.statPoints=(c.statPoints||0)+1;}}
function makeEnemy(id,lv){const m=MON_INDEX[id];if(!m)return makeEnemy("slime",lv);const r=RACES[m.type];const scale=1+0.15*Math.max(0,(game.characters.length-2));
const s={hp:Math.round((40+lv*14)*r.hp*scale),mp:20,atk:Math.round((8+lv*2.2)*r.atk),def:Math.round((6+lv*1.6)*r.def),matk:Math.round((6+lv*1.8)*r.matk),mdef:Math.round((6+lv*1.5)*r.mdef),agi:Math.round((6+lv*1.2)*r.agi),luk:Math.round((5+lv)*r.luk),hit:Math.round((8+lv*1.4)*r.hit),eva:Math.round((4+lv*.9)*r.eva)};
return{id,name:m.nm,race:m.type,type:"enemy",rar:m.rar,level:lv,stats:s};}

function newGame(){return{v:SAVE_VERSION,settings:{showDamage:true,autoItem:true},party:{combo:0,comboMax:100},characters:[],inv:[],gold:100,items:{potion:2,ether:1,elixir:0,respec:0,box:0},stamina:STAMINA_MAX,staminaTs:Date.now(),tower:1,kills:0,bossKills:0,storyCleared:[],flags:{}};}
function dedupeEquip(){const seen=new Set();(game.characters||[]).forEach(c=>{c.equip=(c.equip||[]).filter(u=>{if(seen.has(u))return false;seen.add(u);return true;});});}
function migrateGame(s){if(!s||typeof s!=="object")throw new Error("invalid save");s.settings=Object.assign({showDamage:true,autoItem:true},s.settings||{});s.party=Object.assign({combo:0,comboMax:100},s.party||{});s.characters=Array.isArray(s.characters)?s.characters:[];s.inv=Array.isArray(s.inv)?s.inv:[];s.items=Object.assign({potion:0,ether:0,elixir:0,respec:0,box:0},s.items||{});s.gold=Number.isFinite(+s.gold)?Math.max(0,+s.gold):100;s.stamina=clamp(Number.isFinite(+s.stamina)?+s.stamina:STAMINA_MAX,0,STAMINA_MAX);s.staminaTs=Number.isFinite(+s.staminaTs)?+s.staminaTs:Date.now();s.storyCleared=Array.isArray(s.storyCleared)?s.storyCleared:[];s.tower=Math.max(1,+s.tower||1);s.kills=Math.max(0,+s.kills||0);s.bossKills=Math.max(0,+s.bossKills||0);s.flags=s.flags||{};s.characters.forEach((c,i)=>{c.id=c.id||"c"+(i+1);c.slot=c.slot||i+1;c.level=clamp(+c.level||1,1,100);c.exp=Math.max(0,+c.exp||0);c.sp=Math.max(0,+c.sp||0);c.statPoints=Math.max(0,Number.isFinite(+c.statPoints)?+c.statPoints:Math.max(0,c.level-1));c.primary=Object.assign({str:0,dex:0,agi:0,vit:0,luk:0,int:0},c.primary||{});PRIMARY_KEYS.forEach(k=>c.primary[k]=Math.max(0,+c.primary[k]||0));c.skills=Array.isArray(c.skills)?c.skills.filter(id=>SKILL_INDEX[id]):[];c.equip=Array.isArray(c.equip)?c.equip:[];c.reinc=clamp(+c.reinc||0,0,5);});s.v=SAVE_VERSION;return s;}
function saveGame(){try{game.updatedAt=new Date().toISOString();const old=storage.get(SAVE_KEY);if(old)storage.set(BACKUP_KEY,old);storage.set(SAVE_KEY,JSON.stringify(game));return true;}catch(e){return false;}}
function loadGame(){try{const r=storage.get(SAVE_KEY);if(!r)return false;game=migrateGame(JSON.parse(r));dedupeEquip();return true;}catch(e){try{const b=storage.get(BACKUP_KEY);if(!b)return false;game=migrateGame(JSON.parse(b));dedupeEquip();storage.set(SAVE_KEY,JSON.stringify(game));return true;}catch(ignore){return false;}}}
const exportSave=()=>btoa(unescape(encodeURIComponent(JSON.stringify(game))));
function importSave(s){try{const incoming=migrateGame(JSON.parse(decodeURIComponent(escape(atob(s.trim())))));game=incoming;dedupeEquip();saveGame();return true;}catch(e){return false;}}

function log(t){const el=$("battleLog");const d=document.createElement("div");d.innerHTML=t;el.appendChild(d);el.scrollTop=el.scrollHeight;}
const clearLog=()=>$("battleLog").innerHTML="";
const showDmg=t=>{if(game.settings.showDamage)log(t);};
const pct=(c,m)=>clamp(Math.round(c/m*100),0,100);
const bar=(c,m,cls)=>`<div class="bar ${cls||""}" style="flex:1"><i style="width:${pct(c,m)}%"></i></div>`;

function seriesFor(lv){let s=SERIES[0];SERIES.forEach(x=>{if(lv>=x[0])s=x;});return s;}
function rollRarity(){const roll=Math.random()*100;let acc=0;for(const[k,v]of Object.entries(RARITY)){acc+=v.ch;if(roll<acc)return k;}return"common";}
function genEquip(lv,jobId){const pool=EQ_TYPES.filter(t=>t[4]==="all"||t[4].includes(jobId));const type=pick(pool);const ser=seriesFor(lv);const rar=rollRarity();
const mult=ser[2]*RARITY[rar].mult;const stats={};Object.entries(type[3]).forEach(([k,v])=>{stats[k]=Math.max(1,Math.round(v*mult));});
for(let i=0;i<RARITY[rar].opt;i++){const k=pick(STAT_KEYS);stats[k]=(stats[k]||0)+Math.max(1,Math.round(lv/5+2));}
return{uid:"eq"+(uidSeq++)+"_"+(Date.now()%1e5),name:ser[1]+"の"+type[2],series:ser[1],type:type[0],slot:type[1],lv:ser[0],rar,enh:0,stats,jobs:type[4]};}
const enhCost=it=>Math.floor(50*(1+(it.enh||0))*seriesFor(it.lv)[2]);
const enhChance=it=>clamp(100-(it.enh||0)*8,30,100);
const sellVal=it=>Math.floor(10*seriesFor(it.lv)[2]*RARITY[it.rar].mult);

function switchTab(n){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));$("tab-"+n).classList.add("active");document.querySelector(`[data-tab="${n}"]`).classList.add("active");
if(n==="party")renderParty();if(n==="status")renderPrimaryStatus();if(n==="skill")renderSkills();if(n==="battle"){renderStatus();renderStamina();renderAreaStory();}if(n==="save")renderSave();if(n==="shop")renderShop();}
function renderGold(){$("goldView").textContent=game.gold;$("goldView2").textContent=game.gold;}
function renderPrimaryStatus(){const el=$("primaryStatusList");if(!game.characters.length){el.innerHTML='<div class="card">先にパーティを作成してください。</div>';return;}el.innerHTML=game.characters.map((c,i)=>`<div class="card"><h3>${c.name}　残り${c.statPoints||0}pt</h3><div class="statgrid">${PRIMARY_KEYS.map(k=>`<button class="statbtn" data-c="${i}" data-k="${k}" ${(c.statPoints||0)>0?"":"disabled"}><b>${PRIMARY_NM[k]} ${c.primary[k]||0}</b><br><span class="mini">${PRIMARY_DESC[k]}</span></button>`).join("")}</div></div>`).join("");document.querySelectorAll(".statbtn").forEach(b=>b.onclick=e=>{const x=e.target.closest(".statbtn"),c=game.characters[+x.dataset.c],k=x.dataset.k;if((c.statPoints||0)<=0)return;c.statPoints--;c.primary[k]=(c.primary[k]||0)+1;const t=calcTotal(c);c.currentHp=Math.min(c.currentHp??t.hp,t.hp);c.currentMp=Math.min(c.currentMp??t.mp,t.mp);saveGame();renderPrimaryStatus();});}
function renderParty(){renderGold();const el=$("partyList");if(!game.characters.length){el.innerHTML='<div class="card">未作成</div>';$("itemList").innerHTML="";$("invList").innerHTML="";return;}
el.innerHTML=game.characters.map((c,i)=>{const t=calcTotal(c);const si=setInfo(c);
const usedBy={};game.characters.forEach((o,oi)=>{if(oi!==i)(o.equip||[]).forEach(u=>{usedBy[u]=o.name;});});
const slots=["weapon","sub","armor","accessory"].map(sl=>{const all=(game.inv||[]).filter(it=>it.slot===sl);
const cur=(c.equip||[]).find(u=>{const it=game.inv.find(x=>x.uid===u);return it&&it.slot===sl;})||"";
const ok=all.filter(it=>!usedBy[it.uid]&&c.level>=it.lv&&(it.jobs==="all"||it.jobs.includes(c.jobId))).map(o=>`<option value="${o.uid}" ${o.uid===cur?"selected":""}>${o.name}+${o.enh||0}</option>`).join("");
const ng=all.filter(it=>usedBy[it.uid]||!(c.level>=it.lv&&(it.jobs==="all"||it.jobs.includes(c.jobId)))).map(o=>{const r=[];if(usedBy[o.uid])r.push(usedBy[o.uid]+"装備中");if(c.level<o.lv)r.push("Lv"+o.lv+"必要");if(!(o.jobs==="all"||o.jobs.includes(c.jobId)))r.push("職業違い");return `<option disabled>${o.name}+${o.enh||0}（${r.join("/")}）</option>`;}).join("");
return `<label>${sl}<select data-c="${i}" data-s="${sl}" class="eqsel"><option value="">なし</option>${ok}${ng}</select></label>`;}).join("");
let btns="";
if(c.level>=50&&!c.adv&&ADV_MAP[c.jobId])btns+=`<button data-c="${i}" class="promoBtn"><span class="adv">上級職転職：${JOBS[ADV_MAP[c.jobId]].nm}</span></button>`;
if(c.level>=100&&c.adv&&(c.reinc||0)<5)btns+=`<button data-c="${i}" class="reincBtn"><span class="rc">転生（${(c.reinc||0)+1}回目）</span></button>`;
return `<div class="card"><h3>${c.name}</h3><div class="mini">${JOBS[c.jobId].nm} Lv${c.level} / SP${c.sp||0} / 転生${c.reinc||0} / セット${si.sc}</div>
<div class="mini bw">HP ${c.currentHp??t.hp}/${t.hp} ${bar(c.currentHp??t.hp,t.hp)}</div>
<div class="mini bw">MP ${c.currentMp??t.mp}/${t.mp} ${bar(c.currentMp??t.mp,t.mp,"mp")}</div>
<div class="mini">物攻${t.atk} 物防${t.def} 魔攻${t.matk} 魔防${t.mdef} 素早${t.agi} 運${t.luk} 命中${t.hit} 回避${t.eva}</div>
<div class="two">${slots}</div>${btns}</div>`;}).join("");
document.querySelectorAll(".eqsel").forEach(sel=>sel.addEventListener("change",e=>{const c=game.characters[+e.target.dataset.c];const sl=e.target.dataset.s;const v=e.target.value;
if(v)game.characters.forEach(o=>{o.equip=(o.equip||[]).filter(u=>u!==v);});
c.equip=(c.equip||[]).filter(u=>{const it=game.inv.find(x=>x.uid===u);return it&&it.slot!==sl;});if(v)c.equip.push(v);saveGame();renderParty();}));
document.querySelectorAll(".promoBtn").forEach(b=>b.onclick=e=>{const c=game.characters[+e.target.closest(".card").querySelector(".promoBtn").dataset.c];promote(c);});
document.querySelectorAll(".reincBtn").forEach(b=>b.onclick=e=>{const c=game.characters[+e.target.closest(".card").querySelector(".reincBtn").dataset.c];reincarnate(c);});
$("invList").innerHTML=(game.inv||[]).map(it=>`<div class="mini">${it.name}+${it.enh||0} [${RARITY[it.rar].nm}] Lv${it.lv} <button data-e="${it.uid}" class="enhBtn" ${game.gold>=enhCost(it)&&it.enh<10?"":"disabled"}>強化${enhCost(it)}G(${enhChance(it)}%)</button> <button data-e="${it.uid}" class="sellBtn">売${sellVal(it)}G</button></div>`).join("")||'<div class="mini">なし</div>';
document.querySelectorAll(".enhBtn").forEach(b=>b.onclick=e=>{const it=game.inv.find(x=>x.uid===e.target.dataset.e);const cost=enhCost(it);if(game.gold>=cost&&it.enh<10){game.gold-=cost;
if(Math.random()*100<enhChance(it)){it.enh=(it.enh||0)+1;alert("強化成功！ +"+it.enh);}else alert("強化失敗…");saveGame();renderParty();}});
document.querySelectorAll(".sellBtn").forEach(b=>b.onclick=e=>{const it=game.inv.find(x=>x.uid===e.target.dataset.e);game.gold+=sellVal(it);game.inv=game.inv.filter(x=>x.uid!==it.uid);game.characters.forEach(c=>c.equip=(c.equip||[]).filter(u=>u!==it.uid));saveGame();renderParty();});renderItems();}
function renderItems(){const it=game.items||{};$("itemList").innerHTML=`<div class="card"><div class="mini">ポーション ${it.potion||0}個（HP40%） / エーテル ${it.ether||0}個（MP40%） / エリクサー ${it.elixir||0}個（HP・MP全回復） / 装備箱 ${it.box||0}個</div>${game.characters.map((c,i)=>`<div class="three"><button class="useItemBtn" data-c="${i}" data-i="potion" ${(it.potion||0)>0?"":"disabled"}>${c.name}にHP</button><button class="useItemBtn" data-c="${i}" data-i="ether" ${(it.ether||0)>0?"":"disabled"}>${c.name}にMP</button><button class="useItemBtn" data-c="${i}" data-i="elixir" ${(it.elixir||0)>0?"":"disabled"}>${c.name}を全快</button></div>`).join("")}<button id="openBoxBtn" ${(it.box||0)>0?"":"disabled"}>装備箱を開ける</button></div>`;
document.querySelectorAll(".useItemBtn").forEach(b=>b.onclick=e=>useFieldItem(+e.target.dataset.c,e.target.dataset.i));const ob=$("openBoxBtn");if(ob)ob.onclick=openEquipBox;}
function useFieldItem(i,id){const c=game.characters[i],n=game.items[id]||0;if(!c||n<=0)return;const t=calcTotal(c);if(id==="potion"){if((c.currentHp??t.hp)>=t.hp)return alert("HPは満タンです");c.currentHp=Math.min(t.hp,(c.currentHp??t.hp)+Math.floor(t.hp*.4));}else if(id==="ether"){if((c.currentMp??t.mp)>=t.mp)return alert("MPは満タンです");c.currentMp=Math.min(t.mp,(c.currentMp??t.mp)+Math.floor(t.mp*.4));}else{if((c.currentHp??t.hp)>=t.hp&&(c.currentMp??t.mp)>=t.mp)return alert("HP・MPは満タンです");c.currentHp=t.hp;c.currentMp=t.mp;}game.items[id]--;saveGame();renderParty();}
function openEquipBox(){if((game.items.box||0)<=0||!game.characters.length)return;const c=pick(game.characters),lv=Math.max(...game.characters.map(x=>x.level));game.items.box--;const eq=genEquip(lv,c.jobId);game.inv.push(eq);saveGame();renderParty();alert(eq.name+" ["+RARITY[eq.rar].nm+"]を入手！");}
function promote(c){const oldJob=c.jobId;const advId=ADV_MAP[oldJob];if(!advId)return;
const jobIds=(SKILLS[oldJob]||[]).map(s=>s.id);const kept=(c.skills||[]).filter(id=>jobIds.includes(id)).slice(0,3);
const shared=(c.skills||[]).filter(id=>!jobIds.includes(id));
c.skills=[...shared,...kept];c.jobId=advId;c.level=1;c.exp=0;c.sp=(c.sp||0)+10;c.adv=true;
const t=calcTotal(c);c.currentHp=t.hp;c.currentMp=t.mp;saveGame();renderParty();alert(c.name+"は"+JOBS[advId].nm+"に転職！");}
function reincarnate(c){if(c.level<100||!c.adv||(c.reinc||0)>=5)return;c.reinc=(c.reinc||0)+1;c.level=1;c.exp=0;c.sp=(c.sp||0)+20;
const t=calcTotal(c);c.currentHp=t.hp;c.currentMp=t.mp;saveGame();renderParty();alert(c.name+"は転生した！（"+c.reinc+"回目）");}

let pendingLearn=null;
function skillRow(c,i,s){const learned=(c.skills||[]).includes(s.id);const can=!learned&&c.level>=s.lv&&(c.sp||0)>=s.sp;
return `<div class="mini">${s.nm} [${s.ty==="P"?"被":"主"}] SP${s.sp} Lv${s.lv} ${learned?'<b style="color:#9fe8a8">習得済</b>':`<button data-c="${i}" data-s="${s.id}" class="learnBtn" ${can?"":"disabled"}>習得</button>`}</div>`;}
function renderSkills(){const el=$("skillList");if(!game.characters.length){el.innerHTML='<div class="card">未作成</div>';return;}
el.innerHTML=game.characters.map((c,i)=>{let h=`<div class="card"><h3>${c.name}（SP ${c.sp||0}）${c.adv?' <span class="adv">上級</span>':""}${c.reinc?` <span class="rc">転生${c.reinc}</span>`:""}</h3><div class="mini">― 職業 ―</div>`+(SKILLS[c.jobId]||[]).map(s=>skillRow(c,i,s)).join("");
[["spec_offense","攻撃"],["spec_defense","防御"],["spec_support","支援"],["spec_speed","速度"]].forEach(([k,nm])=>{h+=`<div class="mini"><b>${nm}系統</b></div>`+(SKILLS[k]||[]).map(s=>skillRow(c,i,s)).join("");});
h+=`<div class="mini"><b>基礎鍛錬</b></div>`+(SKILLS.talent||[]).map(s=>skillRow(c,i,s)).join("");
if(c.adv){const pool=COMBAT_JOBS.has(c.jobId)?"adv_attack":"adv_support";h+=`<hr><div class="mini adv"><b>上級スキル</b></div>`+(SKILLS[pool]||[]).map(s=>skillRow(c,i,s)).join("");
h+=`<div class="mini adv"><b>奥義</b></div>`+(SKILLS["ult_"+c.jobId]||[]).map(s=>skillRow(c,i,s)).join("");}
if(c.reinc)h+=`<hr><div class="mini rc"><b>転生スキル</b></div>`+(SKILLS.reinc_pool||[]).map(s=>skillRow(c,i,s)).join("");
return h+"</div>";}).join("");
document.querySelectorAll(".learnBtn").forEach(b=>b.addEventListener("click",e=>{const c=game.characters[+e.target.dataset.c];const s=SKILL_INDEX[e.target.dataset.s];
pendingLearn={c,s};$("lmName").textContent=s.nm;$("lmFl").textContent=FLAVOR[s.id]||"";$("lmDesc").textContent=skillDesc(s);$("learnModal").style.display="block";}));}
function confirmLearn(){if(!pendingLearn)return;const{c,s}=pendingLearn;if(c.level>=s.lv&&(c.sp||0)>=s.sp){c.sp-=s.sp;c.skills=c.skills||[];c.skills.push(s.id);saveGame();renderSkills();renderParty();}
pendingLearn=null;$("learnModal").style.display="none";}

function renderShop(){renderGold();const items=[["potion","ポーション（HP40%回復）",50],["ether","エーテル（MP40%回復）",60],["elixir","エリクサー（全回復）",300],["respec","スキルリセット券",800],["box","装備箱",200]];
$("shopList").innerHTML=items.map(([id,nm,pr])=>`<div class="card"><div class="mini">${nm} 所持:${game.items[id]||0}</div><button data-i="${id}" data-p="${pr}" class="buyBtn" ${game.gold>=pr?"":"disabled"}>購入 ${pr}G</button></div>`).join("");
document.querySelectorAll(".buyBtn").forEach(b=>b.onclick=e=>{const id=e.target.dataset.i,pr=+e.target.dataset.p;if(game.gold>=pr){game.gold-=pr;game.items[id]=(game.items[id]||0)+1;saveGame();renderShop();}});}
function renderSave(){$("storageType").textContent="保存方式："+storage.type+(storage.err?"（理由："+storage.err+"）":"");$("savePreview").textContent=JSON.stringify(game,null,1).slice(0,2500);}
function renderStatus(){const el=$("battleStatus");if(!battle){el.innerHTML="戦闘未開始 / タワー階層："+game.tower+" / 撃破："+(game.kills||0);return;}
el.innerHTML=battle.enemies.map(e=>`<div class="mini"><b>${e.name}</b> Lv${e.level} ${e.hp}/${e.stats.hp} <span class="bw" style="flex:1">${bar(e.hp,e.stats.hp,"en")}</span> <span class="brk">Brk${e.break||0}</span>${e.charge?' <span class="brk">溜め!</span>':""}</div>`).join("")+
`<div class="mini">連携${battle.combo}/${game.party.comboMax} / 死体${battle.corpses||0} / 速度${speed}x</div><hr>`+battle.party.map(m=>`<div class="mini bw">${m.name} HP${m.hp}/${m.maxHp} ${bar(m.hp,m.maxHp)} MP${m.mp}/${m.maxMp} ${bar(m.mp,m.maxMp,"mp")}</div>`).join("");}

function makeChar(id,slot,name,job){const t=jobStats(job,1);return{id,slot,name,jobId:job,level:1,exp:0,sp:0,statPoints:0,primary:{str:0,dex:0,agi:0,vit:0,luk:0,int:0},skills:[],equip:[],currentHp:t.hp,currentMp:t.mp,adv:false,reinc:0};}
function createParty(){const names=[],jobs=[];for(let i=1;i<=4;i++){names.push($("name"+i).value.trim());jobs.push($("job"+i).value);}
if(names.some(n=>!n))return alert("全キャラ名前を入力");if(new Set(names).size!==4)return alert("同じ名前は不可");
game=newGame();game.settings.showDamage=$("showDamage").checked;game.characters=names.map((n,idx)=>makeChar("c"+(idx+1),idx+1,n,jobs[idx]));saveGame();switchTab("party");}

function weaponTypeOf(c){const uid=(c.equip||[]).find(u=>{const it=game.inv.find(x=>x.uid===u);return it&&it.slot==="weapon";});const it=game.inv.find(x=>x.uid===uid);return it?it.type:null;}
function regenStamina(){if(!game)return;const now=Date.now(),elapsed=Math.max(0,now-(game.staminaTs||now)),gain=Math.floor(elapsed/STAMINA_REGEN_MS);if(gain>0){game.stamina=Math.min(STAMINA_MAX,(game.stamina||0)+gain);game.staminaTs+=(gain*STAMINA_REGEN_MS);saveGame();}}
function spendStamina(n){regenStamina();if((game.stamina||0)<n){alert("スタミナが不足しています。3分ごとに1回復します。");renderStamina();return false;}const wasFull=game.stamina>=STAMINA_MAX;game.stamina-=n;if(wasFull||!game.staminaTs||game.staminaTs>Date.now())game.staminaTs=Date.now();saveGame();renderStamina();return true;}
function renderStamina(){if(!$("staminaView"))return;regenStamina();$("staminaView").textContent=(game.stamina||0)+" / "+STAMINA_MAX;if(game.stamina>=STAMINA_MAX){$("staminaRegen").textContent="満タン";return;}const rem=Math.max(0,STAMINA_REGEN_MS-(Date.now()-(game.staminaTs||Date.now()))),m=Math.floor(rem/60000),s=Math.floor(rem%60000/1000);$("staminaRegen").textContent=`次の回復まで ${m}:${String(s).padStart(2,"0")}`;}
function renderAreaStory(){const id=$("areaSelect").value,x=AREA_STORY[id];$("areaStory").textContent=x?x[0]+"｜"+x[1]:"";}
function canBeginBattle(){if(!game||game.characters.length<2){alert("先に4人パーティを作成してください。");return false;}if(battle&&battle.active){alert("現在の戦闘を終えてから選択してください。");return false;}return true;}
function startBattle(enemyArr){stopAuto();if(!game||game.characters.length<2){alert("先にキャラ作成");return;}
const comp={tank:game.characters.some(c=>TANK_JOBS.has(c.jobId)),heal:game.characters.some(c=>HEAL_JOBS.has(c.jobId))};
battle={turn:0,active:true,combo:game.party.combo||0,corpses:0,comp,
enemies:enemyArr.map(e=>Object.assign(e,{hp:e.stats.hp,maxHp:e.stats.hp,states:{},break:0,charge:false,enraged:false,healed:false})),
party:game.characters.map(c=>{const t=calcTotal(c);if(comp.tank)t.def=Math.floor(t.def*1.1);if(comp.heal)t.mdef=Math.floor(t.mdef*1.1);
return{ref:c.id,name:c.name,jobId:c.jobId,weaponType:weaponTypeOf(c),stats:t,flags:t._flags||{},hp:c.currentHp??t.hp,mp:c.currentMp??t.mp,maxHp:t.hp,maxMp:t.mp,states:{},guard:0,shield:0,shieldPct:0,chant:0,summons:[],type:"char"};})};
clearLog();log(`=== ${battle.enemies.map(e=>e.name).join(" / ")} が現れた。 ===`);
if(comp.tank)log("編成ボーナス：全体物防+10%");if(comp.heal)log("編成ボーナス：全体魔防+10%");
battle.enemies.forEach(e=>{const re=RACE_ELEM[e.race]||{};if(re.weak)log(`${e.name} 弱点：<span class="eff">${EL_NM[re.weak]}</span>`);});renderStatus();}
const aliveE=()=>battle.enemies.filter(e=>e.hp>0);
const pickE=()=>{const a=aliveE();return a.length?a[rnd(a.length)]:null;};
function explore(){if(!canBeginBattle()||!spendStamina(STAMINA_COST.explore))return;const a=AREAS.find(x=>x[0]===$("areaSelect").value);const lv=a[2]+rnd(a[3]-a[2]+1);startBattle([makeEnemy(Math.random()<.15?a[5]:pick(a[4]),lv)]);if(battle){battle.mode="explore";battle.areaId=a[0];}}
function boss(){if(!canBeginBattle())return;const a=AREAS.find(x=>x[0]===$("areaSelect").value);const bossId=a&&(a[6]||a[5]);if(!bossId)return alert("ボスなし");if(!spendStamina(STAMINA_COST.boss))return;startBattle([makeEnemy(bossId,a[3])]);if(battle){battle.mode="boss";battle.areaId=a[0];}}
function tower(){if(!canBeginBattle()||!spendStamina(STAMINA_COST.tower))return;const lv=5+game.tower*3;startBattle([makeEnemy(pick(["stone_golem","death_knight","dragon_whelp","void_watcher","shadow_wraith","star_beast"]),lv)]);if(battle){battle.tower=true;battle.mode="tower";}}
function raid(){const n=2+(Math.random()<.5?0:1);const lv=50+rnd(40);const pool=["gargoyle","death_knight","chimera","lake_dragon","chaos_beast","dragon_whelp","void_watcher"];
if(!canBeginBattle()||!spendStamina(STAMINA_COST.raid))return;const arr=[];for(let i=0;i<n;i++)arr.push(makeEnemy(pick(pool),lv));startBattle(arr);if(battle){battle.raid=true;battle.mode="raid";}}
function lowestAlly(){return battle.party.filter(m=>m.hp>0).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0];}
const mpCost=(s,c)=>Math.floor((s.mp||0)*(c.flags.mpReduce?.8:1));
const hitCh=(a,d,m=0)=>clamp(75+a.stats.hit-d.stats.eva+m-(a.states&&a.states.blind?25:0)-(a.states&&a.states.slow?10:0),20,98);
function dealDamage(t,amt){if(t.shield>0&&t.shieldPct>=100){t.shield--;log(`${t.name}の身代わりの影が攻撃を弾いた。`);return 0;}
if(t.guard>0)amt=Math.floor(amt*.5);if(t.shield>0)amt=Math.floor(amt*(1-t.shieldPct/100));if(t.states.vulnerable)amt=Math.floor(amt*1.1);if(t.states.broken)amt=Math.floor(amt*1.3);
if(t.flags&&t.flags.dmgReduce)amt=Math.floor(amt*(1-t.flags.dmgReduce/100));t.hp=Math.max(0,t.hp-amt);return amt;}
function addBreak(e,v){if(!v||e.type!=="enemy")return;e.break=(e.break||0)+v;if(e.break>=100){e.break=0;e.states.broken={turns:2};log(`<span class="brk">=== ${e.name}は体勢を崩した！ ===</span>`);}}
function pickAttackText(c,opt){if(opt.mg)return pick(TEXT.magic);
const wt=c.weaponType;if(wt&&WEAPON_TEXT[wt]&&Math.random()<.5)return pick(WEAPON_TEXT[wt]);
const bj=BASE_OF[c.jobId]||c.jobId;if(JOB_TEXT[bj]&&Math.random()<.6)return pick(JOB_TEXT[bj]);
return pick(TEXT.phys);}
function attack(c,t,opt={}){if(!t||t.hp<=0)return;for(let i=0;i<(opt.hits||1);i++){if(t.hp<=0)break;
if(Math.random()*100>=hitCh(c,t,opt.hm||0)){log(fill(pick(TEXT.miss),{a:c.name,e:t.name}));showDmg(`→ ${t.name}は回避した。`);continue;}
let atk=opt.mg?c.stats.matk:c.stats.atk;if(c.chant>0){atk=Math.floor(atk*(1+c.chant/100));c.chant=0;}
let def=opt.mg?t.stats.mdef:t.stats.def;if(t.states&&t.states.defdown)def=Math.floor(def*.8);def=Math.floor(def*(1-((opt.pen||0)+(c.flags.defPen||0))/100));
let dmg=Math.max(1,Math.floor(atk*(opt.power||100)/100-def*.5+Math.random()*5));
if(battle.turn===1&&c.flags.firstStrike)dmg=Math.floor(dmg*(1+c.flags.firstStrike/100));
let em=1;if(opt.el&&t.type==="enemy"){const re=RACE_ELEM[t.race]||{};if(re.weak===opt.el)em=1.5+(c.flags.elemPow||0)/100;else if(re.resist===opt.el)em=.5;}
dmg=Math.floor(dmg*em);
const critCh=c.stats.luk/4+(c.flags.critRate||0)+(opt.crit||0);const crit=Math.random()*100<critCh;if(crit)dmg=Math.floor(dmg*(1.5+(c.flags.critDmg||0)/100));
const dealt=dealDamage(t,dmg);addBreak(t,opt.brk);if(t.hp<=0&&!t.corpseCounted){t.corpseCounted=true;battle.corpses=(battle.corpses||0)+1;}
log(fill(crit?pick(TEXT.crit):pickAttackText(c,opt),{a:c.name,e:t.name}));
const extra=em>1?` <span class="eff">効果あり！</span>`:em<1?` <span class="res">耐性…</span>`:"";
showDmg(`→ ${t.name}に${dealt}ダメージ${crit?"（会心）":""}${extra}`);
if(opt.st&&t.hp>0&&Math.random()<Math.min(.98,.8+(c.flags.debHit||0)/100)){t.states[opt.st]={turns:3};log(fill(pick(TEXT.status),{e:t.name}));}}}
function useSkill(c,s){c.mp-=mpCost(s,c);
if(s.hpCost){const cost=Math.floor(c.maxHp*s.hpCost/100);c.hp=Math.max(1,c.hp-cost);log(`${c.name}は自らの血を代償に力を解放する。`);}
switch(s.k){
case"dmg":case"drain":{const targets=s.tg==="all"?aliveE():[pickE()];const power=(s.pw||100)*(s.hpCost?1+(c.flags.hpCostPow||0)/100:1);targets.forEach(t=>attack(c,t,{power,hits:s.hits,mg:s.mg,hm:s.hm,crit:s.crit,pen:s.pen,st:s.st,el:s.el,brk:s.brk}));
if(s.k==="drain"){const h=Math.floor(c.stats.matk*.5);c.hp=Math.min(c.maxHp,c.hp+h);showDmg(`→ ${c.name}のHPが${h}回復。`);}break;}
case"heal":{const tg=s.tg==="party"?battle.party.filter(m=>m.hp>0):[lowestAlly()].filter(Boolean);tg.forEach(t=>{const h=Math.floor(c.stats.matk*(s.pw||100)/100*(1+(c.flags.healPow||0)/100)*(1+(t.flags.healRecv||0)/100));t.hp=Math.min(t.maxHp,t.hp+h);if(s.st)t.states[s.st]={turns:s.tn||3};log(fill(pick(TEXT.heal),{a:c.name,t:t.name}));showDmg(`→ ${t.name}のHPが${h}回復。`);});break;}
case"revive":{const d=battle.party.find(m=>m.hp<=0);if(d){d.hp=Math.floor(d.maxHp*(s.pw||30)/100);log(`${c.name}の祈りが${d.name}の意識を呼び戻す。`);}break;}
case"buff":{const tg=s.tg==="party"?battle.party.filter(m=>m.hp>0):[c],pct=s.pct*(1+(c.flags.buffPow||0)/100);tg.forEach(t=>t.stats[s.stat]=Math.floor(t.stats[s.stat]*(1+pct/100)));log(fill(pick(TEXT.buff),{a:c.name}));break;}
case"debuff":{const t=pickE();if(t&&Math.random()*100<80+(c.flags.debHit||0)){t.stats[s.stat]=Math.floor(t.stats[s.stat]*(1-s.pct/100));log(fill(pick(TEXT.debuff),{a:c.name,e:t.name}));}break;}
case"status":{const t=pickE();if(t&&Math.random()*100<80+(c.flags.debHit||0)){t.states[s.st]={turns:s.tn||2};log(fill(pick(TEXT.status),{e:t.name}));}break;}
case"guard":c.guard=2;log(fill(pick(TEXT.guard),{a:c.name}));break;
case"shield":{const tg=s.tg==="party"?battle.party.filter(m=>m.hp>0):[lowestAlly()].filter(Boolean);tg.forEach(t=>{t.shield=2;t.shieldPct=s.pct;});log(fill(pick(TEXT.guard),{a:c.name}));break;}
case"summon":if(c.summons.length<(1+(c.flags.summonMax||0)))c.summons.push({pw:s.pw,turns:s.tn});log(fill(pick(TEXT.summon),{a:c.name}));break;
case"chant":{const t=s.tg==="ally"?lowestAlly():c;if(t)t.chant=(t.chant||0)+s.pct;log(`${c.name}が力を込める。`);break;}
case"cleanse":{const tg=s.tg==="party"?battle.party.filter(m=>m.hp>0):[lowestAlly()].filter(Boolean);tg.forEach(t=>t.states={});log(`${c.name}が清らかな光で仲間を包む。`);break;}
case"mp":{const tg=s.tg==="party"?battle.party.filter(m=>m.hp>0):[lowestAlly()].filter(Boolean);tg.forEach(t=>t.mp=Math.min(t.maxMp,t.mp+s.pw));log(`${c.name}が魔力を供給する。`);break;}}}
function basicAttack(c){const t=pickE();if(!t)return;if(c.flags.double)attack(c,t,{power:60,hits:2,brk:5});else attack(c,t,{power:100,brk:5});}
function chooseAction(c){const L=(c.refSkills||[]).filter(s=>s.ty==="A");const can=s=>c.mp>=mpCost(s,c);let s;
const dead=battle.party.find(m=>m.hp<=0);s=L.find(x=>x.k==="revive");if(dead&&s&&can(s))return s;
const low=lowestAlly();if(low&&low.hp<low.maxHp*.75){s=L.find(x=>x.k==="heal");if(s&&can(s))return s;}
s=L.find(x=>x.k==="summon");if(s&&can(s)&&c.summons.length<(1+(c.flags.summonMax||0))&&Math.random()<.5)return s;
s=L.find(x=>x.k==="buff");if(s&&can(s)&&battle.turn%3===1)return s;
s=L.find(x=>x.k==="debuff"||x.k==="status");if(s&&can(s)&&Math.random()<.4)return s;
s=L.find(x=>x.k==="chant");if(s&&can(s)&&Math.random()<.4)return s;
const d=L.filter(x=>x.k==="dmg"||x.k==="drain");if(d.length&&Math.random()<.7){s=d.reduce((a,b)=>(b.pw||0)>(a.pw||0)?b:a);if(can(s))return s;}return null;}
function bossAI(e,targets){const t=targets[rnd(targets.length)];
if(e.charge){e.charge=false;const dmg=Math.max(1,Math.floor(e.stats.atk*2-t.stats.def*.5));const d=dealDamage(t,dmg);log(`<span class="brk">${e.name}の溜め攻撃が${t.name}を打ち砕く！</span>`);showDmg(`→ ${t.name}に${d}ダメージ。`);return;}
switch(e.id){
case"primordial_dragon":if(battle.turn%3===0){e.charge=true;log(`<span class="brk">${e.name}が炎を溜め始めた…！</span>`);return;}break;
case"cursed_king":if(e.hp<e.stats.hp*.5&&!e.healed){e.healed=true;const h=Math.floor(e.stats.hp*.2);e.hp=Math.min(e.stats.hp,e.hp+h);log(`${e.name}は闇を纏い、傷を再生した。`);return;}
if(Math.random()<.4){battle.party.filter(m=>m.hp>0).forEach(m=>m.states.curse={turns:3});log(`${e.name}の呪いがパーティを縛る。`);return;}break;
case"lake_dragon":if(Math.random()<.4){battle.party.filter(m=>m.hp>0).forEach(m=>{const d=dealDamage(m,Math.max(1,Math.floor(e.stats.matk*.8-m.stats.mdef*.4)));m.states.slow={turns:2};showDmg(`→ ${m.name}に${d}水属性ダメージ。`);});log(`${e.name}は濁流を巻き起こした！`);return;}break;
case"chaos_beast":if(e.hp<e.stats.hp*.5&&!e.enraged){e.enraged=true;e.stats.atk=Math.floor(e.stats.atk*1.3);log(`<span class="brk">${e.name}が憤怒した！</span>`);return;}break;
case"king_slime":if(Math.random()<.3){const d=dealDamage(t,Math.max(1,Math.floor(e.stats.atk*.6)));log(`${e.name}は分裂しながら${t.name}に飛びかかる！`);showDmg(`→ ${t.name}に${d}ダメージ。`);return;}break;}
enemyNormal(e,t);}
function enemyNormal(e,t){if(Math.random()*100>=hitCh(e,t,t.flags&&t.flags.enemyHit||0)){log(fill(pick(TEXT.miss),{a:e.name,e:t.name}));showDmg(`→ ${t.name}はかわした。`);return;}
let dmg=Math.max(1,Math.floor(e.stats.atk-t.stats.def*.5+Math.random()*5));const d=dealDamage(t,dmg);
log(fill(pick(TEXT.enemy),{a:e.name,t:t.name}));showDmg(`→ ${t.name}に${d}ダメージ。`);}
function enemyAct(e){if(e.states.broken){log(`${e.name}は崩れた体勢を立て直せない。`);return;}if(e.states.confuse&&Math.random()<.5){log(`${e.name}は混乱して行動できない。`);return;}
const tg=battle.party.filter(m=>m.hp>0);if(!tg.length)return;
if(e.rar==="boss"||e.rar==="rare")bossAI(e,tg);else enemyNormal(e,tg[rnd(tg.length)]);}
function tickStates(m){const s=m.states;if(!s)return;["poison","burn","bleed"].forEach(k=>{if(s[k]&&m.hp>0){const d=Math.max(1,Math.floor(m.maxHp*.05));m.hp=Math.max(0,m.hp-d);showDmg(`→ ${m.name}は${k}で${d}ダメージ。`);}});
if(s.regen&&m.hp>0){const h=Math.floor(m.maxHp*.06);m.hp=Math.min(m.maxHp,m.hp+h);}Object.keys(s).forEach(k=>{s[k].turns--;if(s[k].turns<=0)delete s[k];});}
function autoItems(){if(!game.settings.autoItem)return;battle.party.forEach(m=>{if(m.hp>0&&m.hp<m.maxHp*.4&&(game.items.potion||0)>0){game.items.potion--;const h=Math.floor(m.maxHp*.4);m.hp=Math.min(m.maxHp,m.hp+h);log(`${m.name}はポーションを飲み干した。`);showDmg(`→ HP${h}回復。`);}});}
function checkEnd(){if(!battle||!battle.active)return true;
if(aliveE().length===0){battle.active=false;stopAuto();victory();return true;}
if(battle.party.every(m=>m.hp<=0)){battle.active=false;stopAuto();log("パーティは力尽きた……かろうじて離脱する。");sync();return true;}return false;}
function victory(){const es=battle.enemies;log(`=== ${es.map(e=>e.name).join(" / ")} を倒した。 ===`);
const maxLv=Math.max(...es.map(e=>e.level));const cnt=es.length;const anyBoss=es.some(e=>e.rar==="boss"||e.rar==="rare");
game.kills=(game.kills||0)+cnt;if(anyBoss)game.bossKills=(game.bossKills||0)+1;
const mult=anyBoss?2:1;const exp=Math.floor((maxLv*12+8)*mult*(1+0.5*(cnt-1)));const gold=Math.floor(maxLv*5*mult*cnt);
game.gold+=gold;log(`→ 経験値${exp} / <span class="gold">${gold}G</span> を獲得。`);
battle.party.forEach(m=>{const c=game.characters.find(x=>x.id===m.ref);if(c){gainExp(c,exp);c.currentHp=Math.max(1,m.hp);c.currentMp=Math.max(0,m.mp);}});
if(battle.tower){game.tower++;log(`→ タワー ${game.tower} 階へ進んだ。`);}
const area=AREAS.find(a=>a[0]===(battle.areaId||$("areaSelect").value));
const dropBonus=battle.party.reduce((n,m)=>n+(m.flags.dropRate||0),0)/Math.max(1,battle.party.length);for(let i=0;i<cnt;i++){if(Math.random()*100<25+battle.party[0].stats.luk/2+dropBonus){const it=genEquip(area?area[7]:maxLv,pick(game.characters).jobId);game.inv.push(it);log(`→ ${it.name} を入手！`);}}
const newChapter=battle.mode==="boss"&&battle.areaId&&game.storyCleared.indexOf(battle.areaId)<0?battle.areaId:null;if(newChapter)game.storyCleared.push(newChapter);game.party.combo=battle.combo;saveGame();renderParty();renderStatus();if(newChapter)setTimeout(()=>showAreaChapter(newChapter),250);}
function sync(){battle.party.forEach(m=>{const c=game.characters.find(x=>x.id===m.ref);if(c){c.currentHp=Math.max(1,m.hp);c.currentMp=Math.max(0,m.mp);}});saveGame();renderParty();renderStatus();}
function playTurn(){if(!battle||!battle.active)return;if(checkEnd())return;battle.turn++;log(`--- ターン${battle.turn} ---`);autoItems();
const actors=[...battle.party.filter(m=>m.hp>0),...aliveE()].map(a=>({a,v:a.stats.agi*(a.states&&a.states.slow ? 0.7 : 1)+rnd(6)})).sort((x,y)=>y.v-x.v).map(x=>x.a);
for(const act of actors){if(!battle.active)break;if(act.hp<=0)continue;
if(act.type==="char"){if(aliveE().length===0)break;
if(act.states.stun){log(`${act.name}はしびれて動けない。`);}else if(act.states.confuse&&Math.random()<.5){log(`${act.name}は混乱して行動できない。`);}else{const c=game.characters.find(x=>x.id===act.ref);act.refSkills=(c.skills||[]).map(id=>SKILL_INDEX[id]).filter(Boolean);
const s=chooseAction(act);if(s)useSkill(act,s);else basicAttack(act);
if(aliveE().length>0&&act.flags.extraAct&&Math.random()*100<act.flags.extraAct){log(`${act.name}は素早く追撃した。`);basicAttack(act);}
act.summons.forEach(sm=>{const t=pickE();if(t){const d=Math.max(1,Math.floor(act.stats.matk*sm.pw/100*(1+(act.flags.summonPow||0)/100)-t.stats.mdef*.3));t.hp=Math.max(0,t.hp-d);log(`召喚獣が${t.name}を攻撃。`);showDmg(`→ ${d}ダメージ。`);}});
battle.combo=Math.min(game.party.comboMax,battle.combo+6);
if(battle.combo>=game.party.comboMax&&aliveE().length>0){battle.combo=0;log("=== パーティ連携 ===");aliveE().forEach(e=>{const dmg=battle.party.filter(m=>m.hp>0).reduce((s,m)=>s+Math.max(1,Math.floor(m.stats.atk*.5)),0);e.hp=Math.max(0,e.hp-dmg);showDmg(`→ ${e.name}に${dmg}連携ダメージ。`);});log("全員の息が重なり、敵陣を打ち抜く。");}}}
else enemyAct(act);
tickStates(act);renderStatus();if(checkEnd())break;}
battle.party.forEach(m=>{if(m.guard>0)m.guard--;if(m.shield>0)m.shield--;});renderStatus();}
function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;}$("autoBtn").textContent="オート開始";}
function toggleAuto(){if(!battle||!battle.active)explore();if(!battle||!battle.active)return;if(autoTimer){stopAuto();return;}
autoTimer=setInterval(()=>{if(battle&&battle.active)playTurn();else stopAuto();},1000/speed);$("autoBtn").textContent="オート停止";}

function hideStart(){$("startScreen").style.display="none";}
function showSequence(items,i=0,done){if(i>=items.length){$("storyModal").style.display="none";if(done)done();return;}const x=items[i];$("storyTitle").textContent=x.t;$("storyBody").textContent=x.b;$("storyModal").style.display="flex";$("storyNext").textContent=x.next||(i===items.length-1?(done?"次へ":"閉じる"):"次へ");$("storyNext").onclick=()=>showSequence(items,i+1,done);}
function startNewStory(){if(storage.get(SAVE_KEY)&&!confirm("新しい物語を始めますか？\n現在のデータは、4人パーティを作成した時点で上書きされます。"))return;game=newGame();battle=null;hideStart();switchTab("create");showSequence(PROLOGUE,0,()=>showSequence(TUTORIAL));}
function continueStory(){if(!loadGame())return alert("続きから読めるセーブデータがありません。");hideStart();regenStamina();renderParty();renderPrimaryStatus();renderStamina();}
function showAreaChapter(id){const x=AREA_STORY[id];if(!x)return;showSequence([{t:x[0]+"　踏破",b:x[1]+"\n\nボスを退けた四人の言鋼に、失われた言葉の欠片が刻まれた。物語は次の地へ続く。"}]);}

function init(){
$("createBoxes").innerHTML=[1,2,3,4].map(i=>`<div class="card"><div class="two"><div><label>キャラ${i}名前</label><input id="name${i}" maxlength="12" value="${["アキラ","ヒスイ","レン","ユキ"][i-1]}"></div><div><label>職業</label><select id="job${i}"></select></div></div></div>`).join("");
Object.entries(JOBS).forEach(([id,j])=>{if(Object.values(ADV_MAP).includes(id))return;for(let i=1;i<=4;i++){const o=document.createElement("option");o.value=id;o.textContent=j.nm;$("job"+i).appendChild(o);}});
$("job2").value="healer";AREAS.forEach(a=>{const o=document.createElement("option");o.value=a[0];o.textContent=`${a[1]} Lv${a[2]}-${a[3]}`;$("areaSelect").appendChild(o);});
const hasStored=!!storage.get(SAVE_KEY);if(!loadGame())game=newGame();$("continueBtn").disabled=!hasStored;$("continueBtn").onclick=continueStory;$("newBtn").onclick=startNewStory;$("showDamage").checked=!!game.settings.showDamage;$("autoItem").checked=!!game.settings.autoItem;
document.querySelectorAll(".tabbtn").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
$("createBtn").onclick=createParty;
$("restBtn").onclick=()=>{game.characters.forEach(c=>{const t=calcTotal(c);c.currentHp=t.hp;c.currentMp=t.mp;});saveGame();renderParty();alert("全回復した。");};
$("towerViewBtn").onclick=()=>alert("タワー："+game.tower+" / 撃破："+game.kills+" / ボス："+game.bossKills);
$("respecBtn").onclick=()=>{if(game.gold>=500||(game.items.respec||0)>0){if(game.items.respec>0)game.items.respec--;else game.gold-=500;game.characters.forEach(c=>{const jobIds=(SKILLS[c.jobId]||[]).map(s=>s.id);c.skills=(c.skills||[]).filter(id=>!jobIds.includes(id));c.sp=c.level-1;});saveGame();renderSkills();renderParty();alert("職スキルをリセットした。");}else alert("Gまたは券が不足");};
$("lmYes").onclick=confirmLearn;$("lmNo").onclick=()=>{pendingLearn=null;$("learnModal").style.display="none";};
$("speedSel").onchange=e=>{speed=+e.target.value;renderStatus();if(autoTimer){stopAuto();toggleAuto();}};$("areaSelect").onchange=renderAreaStory;
$("exploreBtn").onclick=explore;$("bossBtn").onclick=boss;$("towerBtn").onclick=tower;$("raidBtn").onclick=raid;$("turnBtn").onclick=playTurn;$("autoBtn").onclick=toggleAuto;$("stopBtn").onclick=stopAuto;
$("showDamage").onchange=e=>{game.settings.showDamage=e.target.checked;saveGame();};
$("autoItem").onchange=e=>{game.settings.autoItem=e.target.checked;saveGame();};
$("saveBtn").onclick=()=>{$("saveMsg").textContent=saveGame()?"セーブした":"失敗";renderSave();};
$("loadBtn").onclick=()=>{if(loadGame()){$("saveMsg").textContent="ロードした";renderParty();renderSkills();renderSave();}else $("saveMsg").textContent="セーブなし";};
$("deleteBtn").onclick=()=>{if(!confirm("セーブデータと緊急バックアップを削除しますか？\nこの操作は元に戻せません。"))return;storage.del(SAVE_KEY);storage.del(BACKUP_KEY);game=newGame();battle=null;stopAuto();renderParty();renderStatus();renderSave();$("saveMsg").textContent="削除しました";};
$("exportBtn").onclick=()=>{$("saveText").value=exportSave();};
$("importBtn").onclick=()=>{if(importSave($("saveText").value)){$("saveMsg").textContent="インポート成功";renderParty();renderSkills();renderSave();}else $("saveMsg").textContent="失敗";};
renderParty();renderPrimaryStatus();renderAreaStory();renderStamina();renderSave();setInterval(renderStamina,1000);}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
